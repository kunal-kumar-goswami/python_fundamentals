<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#13294b"/>
      <stop offset="100%" stop-color="#1b1b3a"/>
    </linearGradient>
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B8BBE"/>
      <stop offset="100%" stop-color="#306998"/>
    </linearGradient>
    <linearGradient id="pyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="100%" stop-color="#4B8BBE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- subtle dot grid -->
  <g opacity="0.15">
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#8fb3d9"/>
    </pattern>
    <rect width="1200" height="300" fill="url(#dots)"/>
  </g>

  <!-- floating code brackets -->
  <text x="60" y="90" font-family="Consolas, Menlo, monospace" font-size="46" fill="#4B8BBE" opacity="0.5">&lt;/&gt;</text>
  <text x="1060" y="250" font-family="Consolas, Menlo, monospace" font-size="46" fill="#FFD43B" opacity="0.5">{ }</text>

  <!-- Python logo mark (simplified two-snake glyph) -->
  <g transform="translate(90,110)">
    <path d="M50 0 
             C20 0 20 18 20 18 
             L20 36 L70 36 L70 44 L10 44 
             C10 44 0 44 0 72 
             C0 100 10 100 10 100 
             L26 100 L26 84 
             C26 74 34 66 44 66 
             L74 66 
             C84 66 92 58 92 48 
             L92 18 
             C92 18 92 0 50 0 Z" 
          fill="url(#pyBlue)"/>
    <circle cx="34" cy="16" r="6" fill="#0d1b2a"/>

    <path d="M60 130 
             C90 130 90 112 90 112 
             L90 94 L40 94 L40 86 L100 86 
             C100 86 110 86 110 58 
             C110 30 100 30 100 30 
             L84 30 L84 46 
             C84 56 76 64 66 64 
             L36 64 
             C26 64 18 72 18 82 
             L18 112 
             C18 112 18 130 60 130 Z" 
          fill="url(#pyYellow)"/>
    <circle cx="76" cy="114" r="6" fill="#0d1b2a"/>
  </g>

  <!-- Title text -->
  <text x="240" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="url(#titleGrad)">
    Python Basics
  </text>
  <text x="240" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#e8eef7">
    for Beginners
  </text>
  <text x="240" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#9fb3cc">
    A collection of beginner-friendly Python programs · by Kunal Kumar Goswami
  </text>

  <!-- bottom accent line -->
  <rect x="240" y="238" width="620" height="3" rx="1.5" fill="url(#titleGrad)" opacity="0.8"/>
</svg>
